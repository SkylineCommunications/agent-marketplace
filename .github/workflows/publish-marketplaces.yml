name: Publish to marketplaces

# Manual trigger only while the release is being validated.
# Re-enable the push trigger once automated marketplace publishing is desired.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish-vsix:
    name: Publish VSIX to VS Code Marketplace and OpenVSX
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4
        with:
          node-version: '20'

      - name: Install publishing tools
        run: npm install -g @vscode/vsce ovsx

      - name: Read extension version
        id: version
        run: |
          VERSION=$(node -p "require('./adapters/vscode/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Package VSIX
        run: |
          cd adapters/vscode
          vsce package --no-dependencies

      - name: Publish to Visual Studio Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          vsce publish \
            --packagePath "adapters/vscode/dataminer-devops-${{ steps.version.outputs.version }}.vsix" \
            --pat "$VSCE_PAT"

      - name: Publish to OpenVSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          ovsx publish \
            "adapters/vscode/dataminer-devops-${{ steps.version.outputs.version }}.vsix" \
            --pat "$OVSX_PAT"

      - name: Summary
        if: always()
        run: |
          echo "## VSIX published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Version: \"${{ steps.version.outputs.version }}\"" >> "$GITHUB_STEP_SUMMARY"
          echo "VS Code publisher: SkylineCommunications" >> "$GITHUB_STEP_SUMMARY"
          echo "OpenVSX publisher: SkylineCommunications" >> "$GITHUB_STEP_SUMMARY"

  publish-claude-bundle:
    name: Attach Claude plugin bundle to release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Bundle Claude plugin
        run: zip -r claude-plugin-bundle.zip .claude-plugin

      - name: Attach bundle to latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(git describe --tags --abbrev=0)
          gh release upload "$TAG" claude-plugin-bundle.zip --clobber

      - name: Summary
        if: always()
        run: |
          echo "## Claude plugin bundle attached to release" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Download: ${{ github.server_url }}/${{ github.repository }}/releases/latest/download/claude-plugin-bundle.zip" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Note: Claude Code / Claude Desktop marketplace submission is still manual." >> "$GITHUB_STEP_SUMMARY"